title: Across
author: Ezra Alvarion
email: ezraalvarionderrian+site@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  When the absurd meets the truth.
  "The original is unfaithful to the translation."
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com
username:
  twitter: Ezra72229661
  github:  AntimatterReactor
  soundcloud: hexalrand

header_pages:
  - index.md
  - projects.md
  - writing.md
  - about.md

defaults:
  # Series parts: poem/<parent-slug>/_posts/YYYY-MM-DD-slug.md
  - scope:
      path: "poem"
      type: "posts"
    values:
      layout: poem
      series_child: true
      permalink: /:categories/:title/

# Build settings
# theme: minima
# remote_theme: aterenin/minima-reboot
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme
  - jekyll-redirect-from

sass:
  sass_dir: _sass

minima_reboot:
  date_format: "%b %-d, %Y"
  date_format_short: "%b %d"

exclude:
  - README.md
  - TODO.md
  - CLAUDE.md
  - PALETTES.md
  - REVIEW.md
  - run.sh
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
